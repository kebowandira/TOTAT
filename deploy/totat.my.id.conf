# nginx config for totat.my.id — static landing page only
# Place at: /etc/nginx/sites-available/totat.my.id
# Also copy: cloudflare-realip.conf -> /etc/nginx/conf.d/cloudflare-realip.conf
#   (only needed/useful if the DNS record is Cloudflare-proxied / orange cloud)
# Enable:  sudo ln -s /etc/nginx/sites-available/totat.my.id /etc/nginx/sites-enabled/
# Then:    sudo nginx -t && sudo systemctl reload nginx
# Run Certbot AFTER this config is live (see DEPLOY_STEPS.md) — it will
# rewrite this file to add the HTTPS server block automatically.
#
# POST-CERTBOT MANUAL STEP: Certbot does not add HSTS. Once the HTTPS
# block exists and you've confirmed the site works over https for a
# few days, add to that block (see DEPLOY_STEPS.md for details):
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
    listen 80;
    listen [::]:80;
    server_name totat.my.id www.totat.my.id;

    root /var/www/totat.my.id;
    index index.html;

    # Restores real visitor IP when traffic is proxied through Cloudflare.
    # No-op (harmless) if the DNS record is not proxied. See the include
    # file for the verify-before-deploy note.
    include /etc/nginx/conf.d/cloudflare-realip.conf;

    # --- Security headers ---
    # script-src/style-src have no 'unsafe-inline': the page's JS lives in
    # assets/main.js and there are no inline <style> attributes, so this
    # actually blocks injected inline script/style rather than allowing it.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # No directory listing, no dotfile access
    autoindex off;
    location ~ /\. {
        deny all;
    }

    # Cache static assets briefly — this page has no build step / versioned
    # filenames yet, so keep cache short until a real asset pipeline exists
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Deny access to this config file and any stray backup files if copied
    # into webroot by mistake
    location ~* \.(conf|bak|old|swp)$ {
        deny all;
    }
}
